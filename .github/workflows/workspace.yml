name: workspace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run before it. Pushes to
# main are never cancelled: each one is a commit someone may need a verdict on.
concurrency:
  group: workspace-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Full debug info made this job write 64 GB before packaging began, which is
  # what ran a smaller hosted runner out of disk. Line tables keep file and line
  # in a test's backtrace, which is all CI reads.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  release-gates:
    name: fmt · clippy · test · package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # This job builds the all-features workspace, the benchmark runner in its
      # own target directory, and every crate again for package verification. It
      # ran out of disk in package verification on d6ecf31, having passed near
      # the limit before. None of these preinstalled toolchains is used here.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out Grust
        uses: actions/checkout@v6

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake libssl-dev pkg-config protobuf-compiler

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Graph benchmark formatting
        run: cargo fmt --manifest-path benchmarks/lsqb/Cargo.toml -- --check

      - name: Workspace build
        run: cargo build --locked --workspace --all-features

      - name: Workspace Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

      - name: Graph benchmark Clippy
        run: cargo clippy --locked --manifest-path benchmarks/lsqb/Cargo.toml --all-targets -- -D warnings

      # grust-ladybug is tested on its own. LadybugDB's prebuilt static library
      # bundles zstd, and a whole-workspace --all-features build unifies
      # features so that zstd-sys (LanceDB, Arrow IPC compression) lands in a
      # crate Ladybug links as well. rust-lld then rejects the duplicate ZSTD_*
      # symbols in Ladybug's test binary. Built alone, Ladybug never pulls
      # zstd-sys, so its tests link and still run with its default features.
      - name: Workspace tests
        run: cargo test --locked --workspace --all-features --exclude grust-ladybug

      - name: Ladybug tests
        run: cargo test --locked -p grust-ladybug

      # The offline benchmark tests read the pinned LSQB example dataset, which
      # is fetched and verified rather than checked in.
      - name: Pinned LSQB sources
        run: benchmarks/lsqb/fetch-upstream.sh

      # The runner's process tests assert wall-clock windows as short as 50 ms
      # (reap grace, READY timeout). A starved hosted runner can stall a process
      # for longer than that, and did: three of them failed together on a
      # documentation-only commit. A real defect fails every attempt, so up to
      # three attempts cost nothing in signal. Widening the windows is the fix
      # that belongs in the harness; see docs/LSQB_RUNNER_TIMING_FLAKES.md.
      - name: Graph benchmark tests
        run: |
          for attempt in 1 2 3; do
            if cargo test --locked --manifest-path benchmarks/lsqb/Cargo.toml; then
              exit 0
            fi
            echo "::warning::Graph benchmark tests failed on attempt ${attempt}"
          done
          exit 1

      # The benchmark runner's build is done with; packaging rebuilds every crate.
      - name: Drop the benchmark build
        run: rm -rf benchmarks/lsqb/target && df -h /

      - name: Release package verification
        run: cargo package --locked --workspace --allow-dirty

      - name: Third-party package attribution
        run: bash scripts/verify-package-attribution.sh
