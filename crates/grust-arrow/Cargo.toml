[package]
name = "grust-arrow"
version = "0.16.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Arrow tables and IPC interchange for Grust property graphs"

[features]
default = ["arrow-59"]
adbc = ["arrow-59", "dep:adbc_core"]
ffi = ["arrow_array_55?/ffi", "arrow_array_58?/ffi", "arrow-array?/ffi"]
arrow-55 = ["dep:arrow_array_55", "dep:arrow_schema_55", "dep:arrow_ipc_55"]
arrow-58 = ["dep:arrow_array_58", "dep:arrow_schema_58", "dep:arrow_ipc_58"]
arrow-59 = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-ipc"]

[dependencies]
adbc_core = { version = "0.24.0", optional = true }
serde_json.workspace = true
grust-core = { path = "../grust-core", version = "0.16.0" }
arrow-array = { version = "59.3.0", optional = true }
arrow-schema = { version = "59.3.0", optional = true }
arrow-ipc = { version = "59.3.0", optional = true }

arrow_array_55 = { package = "arrow-array", version = "55", optional = true }
arrow_schema_55 = { package = "arrow-schema", version = "55", optional = true }
arrow_ipc_55 = { package = "arrow-ipc", version = "55", optional = true }
arrow_array_58 = { package = "arrow-array", version = "58", optional = true }
arrow_schema_58 = { package = "arrow-schema", version = "58", optional = true }
arrow_ipc_58 = { package = "arrow-ipc", version = "58", optional = true }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "pipelines"
harness = false
required-features = ["arrow-59"]
