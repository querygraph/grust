[package]
name = "grust-datafusion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Shared DataFusion 55 execution foundation for Grust Arrow pipelines"
keywords.workspace = true
categories.workspace = true

[features]
cypher = ["dep:grust-cypher", "dep:serde_json"]

[dependencies]
grust-core = { version = "0.21.0", path = "../grust-core" }
grust-procedures = { version = "0.21.0", path = "../grust-procedures" }
grust-cypher = { version = "0.21.0", path = "../grust-cypher", optional = true }
datafusion = { version = "55.0.0", default-features = false, features = ["sql", "recursive_protection"] }
grust-arrow = { version = "0.21.0", path = "../grust-arrow" }
futures = "0.3.32"
tokio = { workspace = true, features = ["time"] }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

