[package]
name = "grust-ladybug"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "LadybugDB GraphStore backend for Grust."
publish = false  # Internal backend: independently validated and intentionally outside the facade.
keywords.workspace = true
categories.workspace = true

[features]
default = ["arrow"]
arrow = ["dep:arrow", "lbug/arrow", "dep:grust-arrow"]

[dependencies]
grust-arrow = { version = "0.17.0", path = "../grust-arrow", default-features = false, features = ["arrow-55"], optional = true }
arrow = { version = "55", optional = true }
async-trait = { workspace = true }
grust-core = { version = "0.17.0", path = "../grust-core" }
lbug = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
