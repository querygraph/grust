[package]
name = "grust-graph"
version = "0.14.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A backend-neutral property graph facade for Rust."
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lib]
name = "grust"

[features]
default = []
algorithms = ["dep:grust-algorithms", "dep:grust-algorithm-procedures", "dep:grust-procedures"]
arrow = ["dep:grust-arrow", "grust-algorithms?/arrow"]
cocoindex = ["dep:grust-cocoindex"]
cypher = ["dep:grust-cypher", "dep:grust-procedures"]
falkor = ["dep:grust-falkor"]
lancedb = ["dep:grust-lancedb"]
memory = ["dep:grust-memory"]
postgres = ["dep:grust-postgres"]
postgres-pgq = ["dep:grust-postgres-pgq"]
pggraph = ["dep:grust-pggraph"]
# Sail is a Cypher execution backend, so it depends on the shared Cypher
# language layer; enabling `sail` enables `cypher` (the facade re-exports the
# Cypher language surface once, from the `cypher` block).
sail = ["dep:grust-sail", "cypher"]
surreal = ["dep:grust-surreal"]
turso = ["dep:grust-turso"]
turso-sync = ["turso", "grust-turso/sync"]
typed-garde = ["grust-core/typed-garde"]
typed-zod-rs = ["typed-garde", "grust-core/typed-zod-rs"]

[dependencies]
grust-procedures = { version = "0.14.0", path = "../grust-procedures", optional = true }
grust-algorithms = { version = "0.14.0", path = "../grust-algorithms", optional = true }
grust-algorithm-procedures = { version = "0.14.0", path = "../grust-algorithm-procedures", optional = true }
grust-arrow = { version = "0.14.0", path = "../grust-arrow", optional = true }
grust-core = { version = "0.14.0", path = "../grust-core" }
grust-cocoindex = { version = "0.14.0", path = "../grust-cocoindex", optional = true }
grust-cypher = { version = "0.14.0", path = "../grust-cypher", optional = true }
grust-falkor = { version = "0.14.0", path = "../grust-falkor", optional = true }
grust-lancedb = { version = "0.14.0", path = "../grust-lancedb", optional = true }
grust-memory = { version = "0.14.0", path = "../grust-memory", optional = true }
grust-postgres = { version = "0.14.0", path = "../grust-postgres", optional = true }
grust-postgres-pgq = { version = "0.14.0", path = "../grust-postgres-pgq", optional = true }
grust-pggraph = { version = "0.14.0", path = "../grust-pggraph", optional = true }
grust-sail = { version = "0.14.0", path = "../grust-sail", optional = true }
grust-surreal = { version = "0.14.0", path = "../grust-surreal", optional = true }
grust-turso = { version = "0.14.0", path = "../grust-turso", optional = true }
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
garde = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_yaml.workspace = true
sha2 = "0.10"
zod-rs.workspace = true

[[example]]
name = "typed_graph_garde"
required-features = ["typed-garde"]

[[example]]
name = "typed_graph_garde_mixed"
required-features = ["typed-garde"]

[[example]]
name = "typed_graph_zod_garde"
required-features = ["typed-zod-rs"]

[[example]]
name = "typed_graph_zod_garde_errors"
required-features = ["typed-zod-rs"]
