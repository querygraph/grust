[package]
name = "grust-memory"
version = "0.14.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Deterministic in-memory GraphStore implementation for Grust."
keywords.workspace = true
categories.workspace = true

[dependencies]
async-trait.workspace = true
grust-core = { version = "0.14.0", path = "../grust-core" }
hashbrown = "0.15"

[dev-dependencies]
criterion.workspace = true
futures-executor.workspace = true
grust-core = { version = "0.14.0", path = "../grust-core", features = ["typed-garde"] }
garde = { workspace = true, features = ["derive"] }
grust-cypher = { version = "0.14.0", path = "../grust-cypher" }
serde.workspace = true

[[bench]]
name = "memory_store"
harness = false
