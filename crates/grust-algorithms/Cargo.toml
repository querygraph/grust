[package]
name = "grust-algorithms"
version = "0.22.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Budgeted property-graph projections and reusable graph analytics for Grust."
keywords.workspace = true
categories.workspace = true

[features]
default = ["parallel"]
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:grust-arrow"]
# Threads for the kernels, bounded by what each execution asks for. Results are
# identical at any width. Off compiles only the sequential code, which is also
# the differential oracle the parallel paths are tested against.
parallel = ["dep:rayon"]

[dependencies]
grust-arrow = { version = "0.22.0", path = "../grust-arrow", optional = true }
grust-core = { version = "0.22.0", path = "../grust-core" }
grust-procedures = { version = "0.22.0", path = "../grust-procedures" }
arrow-array = { version = "59.3.0", optional = true }
arrow-schema = { version = "59.3.0", optional = true }
rayon = { version = "1.11", optional = true }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
rayon = "1.11"
criterion.workspace = true

[[bench]]
name = "degree"
harness = false
