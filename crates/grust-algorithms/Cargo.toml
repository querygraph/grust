[package]
name = "grust-algorithms"
version = "0.21.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Budgeted property-graph projections and reusable graph analytics for Grust."
keywords.workspace = true
categories.workspace = true

[features]
default = ["parallel"]
arrow = ["dep:arrow-array", "dep:grust-arrow"]
# Run kernels on the caller's rayon pool. Results are identical at any width.
parallel = ["dep:rayon"]

[dependencies]
grust-arrow = { version = "0.21.0", path = "../grust-arrow", optional = true }
grust-core = { version = "0.21.0", path = "../grust-core" }
grust-procedures = { version = "0.21.0", path = "../grust-procedures" }
arrow-array = { version = "59.3.0", optional = true }
rayon = { version = "1.11", optional = true }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
rayon = "1.11"
criterion.workspace = true

[[bench]]
name = "degree"
harness = false
