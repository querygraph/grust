[package]
name = "sail-nutmeg-extension"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
nutmeg-graph = { path = "../vendor/nutmeg-graph" }
sail-native-resource-ffi = { path = "../../../crates/sail-native-resource-ffi" }
sail-argentea-core = { path = "../argentea" }
grust-procedures = "=0.24.0"
grust-arrow = "=0.24.0"
datafusion = { version = "=55.1.0", default-features = false, features = ["recursive_protection"] }
datafusion-common = { version = "=55.1.0", default-features = false }
datafusion-execution = { version = "=55.1.0", default-features = false }
datafusion-ffi = { version = "=55.1.0" }
arrow = "=59.3.0"
# Pin the complete Arrow family, including transitive dependencies.
arrow-arith = "=59.3.0"
arrow-array = "=59.3.0"
arrow-buffer = "=59.3.0"
arrow-cast = "=59.3.0"
arrow-csv = "=59.3.0"
arrow-data = "=59.3.0"
arrow-ipc = "=59.3.0"
arrow-json = "=59.3.0"
arrow-ord = "=59.3.0"
arrow-row = "=59.3.0"
arrow-schema = "=59.3.0"
arrow-select = "=59.3.0"
arrow-string = "=59.3.0"
async-trait = "0.1"
futures = "0.3"
pyo3 = { version = "=0.29.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

[features]
extension-module = ["pyo3/extension-module"]

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
codegen-units = 16
