[package]
name = "nutmeg-graph"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/querygraph/nutmeg"
publish = false

[workspace]

[dependencies]
datafusion = { version = "=55.1.0", default-features = false, features = ["recursive_protection"] }
datafusion-common = { version = "=55.1.0", default-features = false }
datafusion-expr = { version = "=55.1.0", default-features = false }
arrow = "=59.3.0"
# Pin the complete Arrow family, including transitive dependencies.
arrow-arith = "=59.3.0"
arrow-array = "=59.3.0"
arrow-buffer = "=59.3.0"
arrow-cast = "=59.3.0"
arrow-csv = "=59.3.0"
arrow-data = "=59.3.0"
arrow-ipc = "=59.3.0"
arrow-json = "=59.3.0"
arrow-ord = "=59.3.0"
arrow-row = "=59.3.0"
arrow-schema = "=59.3.0"
arrow-select = "=59.3.0"
arrow-string = "=59.3.0"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
rayon = "1"
grust-algorithms = { version = "=0.24.0", features = ["arrow"] }
grust-algorithm-procedures = { version = "=0.24.0", features = ["arrow"] }
grust-procedures = "=0.24.0"
grust-core = "=0.24.0"
grust-arrow = "=0.24.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
datafusion = { version = "=55.1.0", default-features = false, features = ["sql", "recursive_protection"] }

[profile.dev]
debug = 0
incremental = false
