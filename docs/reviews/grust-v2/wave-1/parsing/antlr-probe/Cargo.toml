# ANTLR 4 Rust-target probe for the Grust v2 parsing report. Run generate.sh first.
[package]
name = "antlr-probe"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
antlr4rust = "=0.6.0"
[features]
default = ["cypher", "gql"]
cypher = []
gql = []
[profile.release]
debug = false
