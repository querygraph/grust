[package]
name = "grust-kernel-abi"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Sketch: the memory discipline contract for CSR-in, Arrow-out kernels, in Rust and across the Arrow C data interface."

[dependencies]
arrow-array = { version = "59", features = ["ffi"] }
arrow-buffer = "59"
arrow-data = { version = "59", features = ["ffi"] }
arrow-schema = { version = "59", features = ["ffi"] }
