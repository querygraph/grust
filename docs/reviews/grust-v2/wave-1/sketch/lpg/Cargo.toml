[package]
name = "grust-lpg"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Sketch: the labeled property graph as a graph of property groups. No execution, no backends."

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
