[package]
name = "sail-sdp-orc-dependency-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
arrow = { version = "=59.2.0", default-features = false, features = ["json"] }
orc-rust = { version = "=0.9.0", default-features = false, features = ["async"] }
serde_json = "1"

# Keep the whole Arrow family at Sail's locked version.
arrow-arith = { version = "=59.2.0", default-features = false }
arrow-array = { version = "=59.2.0", default-features = false }
arrow-buffer = { version = "=59.2.0", default-features = false }
arrow-cast = { version = "=59.2.0", default-features = false }
arrow-csv = { version = "=59.2.0", default-features = false }
arrow-data = { version = "=59.2.0", default-features = false }
arrow-ipc = { version = "=59.2.0", default-features = false }
arrow-json = { version = "=59.2.0", default-features = false }
arrow-ord = { version = "=59.2.0", default-features = false }
arrow-row = { version = "=59.2.0", default-features = false }
arrow-schema = { version = "=59.2.0", default-features = false }
arrow-select = { version = "=59.2.0", default-features = false }
arrow-string = { version = "=59.2.0", default-features = false }

tokio = { version = "1", features = ["rt", "fs"] }
futures = "0.3"

prost = "0.13"
bytes = "1"

[profile.dev]
debug = 0
incremental = false
