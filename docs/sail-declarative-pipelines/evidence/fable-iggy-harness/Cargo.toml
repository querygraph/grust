[package]
name = "fable-iggy-harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "Fable unit 6: capability and fault observations against the pinned Apache Iggy broker, using Iggy's own integration harness"

[dependencies]
integration = { path = "/Users/alexy/src/iggy-fable-pin/core/integration" }
iggy = { path = "/Users/alexy/src/iggy-fable-pin/core/sdk" }
iggy_common = { path = "/Users/alexy/src/iggy-fable-pin/core/common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

