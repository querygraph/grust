[package]
name = "streamsource-marker-probe"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
datafusion = { version = "=55.2.0", default-features = false }
datafusion-common = "=55.2.0"
datafusion-expr = { version = "=55.2.0", default-features = false }
datafusion-physical-expr = "=55.2.0"
datafusion-physical-plan = "=55.2.0"
arrow = "=59.2.0"
chrono = "=0.4.44"
futures = "=0.3.32"
pin-project-lite = "=0.2.17"
prost = "=0.14.4"
tonic = { version = "=0.14.6", default-features = false, features = ["codegen"] }
serde_json = "=1.0.150"

[build-dependencies]
tonic-prost-build = "=0.14.6"

[profile.dev]
debug = 0
incremental = false
